# Prefer zsh wherever it lives on this platform.
if-shell 'test -x /opt/homebrew/bin/zsh' 'set-option -g default-shell /opt/homebrew/bin/zsh'
if-shell 'test -x /usr/bin/zsh' 'set-option -g default-shell /usr/bin/zsh'
if-shell 'test -x /bin/zsh' 'set-option -g default-shell /bin/zsh'

set -g mouse on
set -sg escape-time 10
set -g set-clipboard on
set -g extended-keys on          # tell Enter, Shift-Enter, ... apart (agents rely on this)
set-window-option -g mode-keys vi

# Yank to the *local* clipboard from anywhere (laptop, ssh, mosh): clipboard-copy
# prefers pbcopy, then the lemonade relay, then OSC 52. The lemonade path is what
# makes copy work over mosh < 1.4, which drops OSC 52.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "$HOME/.config/bin/clipboard-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "$HOME/.config/bin/clipboard-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$HOME/.config/bin/clipboard-copy"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'   # must stay last
