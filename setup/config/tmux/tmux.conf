# Prefer zsh wherever it lives on this platform.
if-shell 'test -x /opt/homebrew/bin/zsh' 'set-option -g default-shell /opt/homebrew/bin/zsh'
if-shell 'test -x /usr/bin/zsh' 'set-option -g default-shell /usr/bin/zsh'
if-shell 'test -x /bin/zsh' 'set-option -g default-shell /bin/zsh'

set -g mouse on
set -sg escape-time 10
set -g set-clipboard on
set -g extended-keys on          # tell Enter, Shift-Enter, ... apart (agents rely on this)
set-window-option -g mode-keys vi

# Claude Code's TUI asks for this in every pane started without it: focus events
# are how it learns its pane stopped being the visible one, so it can stop
# animating and notify instead of drawing to a window nobody is looking at.
set -g focus-events on

# Yank to the *local* clipboard from anywhere (laptop, ssh, mosh): clipboard-copy
# prefers pbcopy, then the lemonade relay, then OSC 52. The lemonade path is what
# makes copy work over mosh < 1.4, which drops OSC 52.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "$HOME/.config/bin/clipboard-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "$HOME/.config/bin/clipboard-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$HOME/.config/bin/clipboard-copy"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Session persistence. resurrect saves the skeleton — windows, layouts, working
# directories — and continuum replays it when the server comes back, so nothing
# depends on remembering `prefix + Ctrl-s` before a reboot. The saving itself is
# done by ~/.config/bin/tmux-persist on a timer; see setup/lib/sessions.sh for
# why continuum's own save triggers cannot be relied on.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# Agent sessions are restored by claude-panes, not by @resurrect-processes.
#
# resurrect's own process restore types the saved command into the pane the
# instant it creates it, and a zsh still sourcing its startup files swallows the
# line without a trace — observed working and not working from the same save
# file. A restore that works most mornings is worse than one that never does,
# because nothing tells you which morning it was.
#
# claude-panes restore instead reads its own map (which, unlike the save file,
# is never blanked by a save taken after a failed restore), waits for an idle
# prompt, sends the command, and confirms it took. Everything else (vim, less,
# ...) keeps resurrect's built-in default list.
#
# `~` and not `$HOME`: tmux escapes the `$` when it stores a single-quoted
# option (the value comes back as `\$HOME/...`), and resurrect runs hooks
# through `eval`, which then hands the shell a literal $HOME and fails with "No
# such file or directory". A leading `~` survives the round trip.
set -g @resurrect-hook-post-restore-all '~/.config/bin/claude-panes restore'

# Whenever a save happens from any trigger — the tmux-persist timer, continuum
# while a client is attached, or a manual `prefix + Ctrl-s` — refresh the name
# map in the same breath, so the layout on disk and the map on disk always
# describe the same moment.
set -g @resurrect-hook-post-save-all '~/.config/bin/claude-panes sync --quiet'

run '~/.tmux/plugins/tpm/tpm'   # must stay last
